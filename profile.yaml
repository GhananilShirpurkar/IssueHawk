# IssueHawk Developer Curation Profile
# Customize your tech stack, preferences, and filters below.

profile:
  name: "Growth Developer"
  github_username: "" # Optional: set your GitHub username to auto-sync merged PRs & XP
  
  # Progression Tier: apprentice | contributor | core_contributor | mentorship_ready
  # - apprentice: beginner & good first issues
  # - contributor: intermediate bugs, feature enhancements
  # - core_contributor: core features, performance, refactoring
  # - mentorship_ready: subsystem architecture, LFX Mentorship & GSoC candidate issues
  tier: "core_contributor"
  auto_graduate: true # Automatically advance tier when XP / PR milestones are reached

  # Career & Target Track: lfx_gsoc_ready | core_contributor | general_open_source
  track: "lfx_gsoc_ready"

  # Target Premier Foundations & Mentorship Organizations: cncf | lfx | apache | gsoc
  target_foundations:
    - "cncf"
    - "lfx"
    - "apache"
    - "gsoc"
  
  # Core stacks and frameworks of interest
  skills:
    - "FastAPI"
    - "LangGraph"
    - "React"
    - "RAG pipelines"
    - "Python async"
    - "AI Agents"
    - "Vector Databases"
    
  # Primary programming languages to search and prioritize
  languages:
    - "python"
    - "typescript"
    - "javascript"

  # GitHub topics to target in queries
  topics:
    - "fastapi"
    - "react"
    - "nextjs"
    - "django"
    - "nodejs"
    - "agents"
    - "llm"

  # Preferences & tone for LLM scoring
  preferences:
    focus: "Subsystem architecture, high-impact core features, performance optimizations, and LFX/GSoC portfolio issues."
    avoid: "Pure documentation, typos, trivial 1-line changes, or dead repositories."

  # Issue filters
  min_score: 6
  max_results: 15
  min_stars: 50 # Minimum repository stars for non-foundation queries
  exclude_labels:
    - "documentation"
    - "docs"
    - "typo"
    - "typos"
    - "wontfix"
    - "invalid"
    - "duplicate"
    - "question"

  # Triage settings
  filter_claimed: true # Check if issue is already claimed in comments/assignees
  filter_inactive_repos: true # Avoid repos with no activity for > 1 year
