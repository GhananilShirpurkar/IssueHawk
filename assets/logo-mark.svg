<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="markHawkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="markReticleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Dark Rounded Container Backdrop -->
  <rect width="120" height="120" rx="28" fill="#0b0f19" />
  <rect width="118" height="118" x="1" y="1" rx="27" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Hawk Head Mark Profile -->
  <g transform="translate(4, 10)">
    <!-- Top Feather Blade -->
    <path d="M 12 20 L 68 20 L 45 40 L 22 40 Z" fill="url(#markHawkGrad)" />
    
    <!-- Middle Feather Blade -->
    <path d="M 8 44 L 68 44 L 50 64 L 18 64 Z" fill="url(#markHawkGrad)" opacity="0.95" />
    
    <!-- Lower Neck / Wing Fold -->
    <path d="M 22 68 L 66 68 L 48 92 L 32 92 Z" fill="url(#markHawkGrad)" opacity="0.9" />

    <!-- Head Crown & Beak -->
    <path d="M 45 20 L 80 20 C 92 20 102 30 102 42 C 102 52 107 62 114 68 C 104 72 92 75 84 68 C 77 62 74 58 70 58 L 45 20 Z" fill="url(#markHawkGrad)" />
    
    <!-- Sharp Hooked Beak -->
    <path d="M 90 42 C 100 42 112 50 117 68 C 108 70 94 66 88 58 Z" fill="#38bdf8" />

    <!-- Crosshair Target Eye -->
    <g transform="translate(77, 38)">
      <!-- Outer Crosshair Circle -->
      <circle cx="0" cy="0" r="10" stroke="url(#markReticleGrad)" stroke-width="2.5" fill="#0b0f19" />
      <!-- Inner Target Core -->
      <circle cx="0" cy="0" r="4" fill="#38bdf8" />
      <!-- Reticle Crosshair Ticks -->
      <line x1="-14" y1="0" x2="-8" y2="0" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
      <line x1="8" y1="0" x2="14" y2="0" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
      <line x1="0" y1="-14" x2="0" y2="-8" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
      <line x1="0" y1="8" x2="0" y2="14" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>
</svg>
